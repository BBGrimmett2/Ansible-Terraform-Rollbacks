---
# AAP Custom Credential Types configuration
controller_credential_types:
  - name: Slack Webhook
    description: Slack incoming webhook URL for sending notifications
    kind: cloud
    inputs:
      fields:
        - id: webhook_url
          type: string
          label: Slack Webhook URL
          secret: true
          help_text: "The full incoming webhook URL from Slack (https://hooks.slack.com/services/...)"
      required:
        - webhook_url
    injectors:
      extra_vars:
        slack_webhook_url: "{{ webhook_url }}"
