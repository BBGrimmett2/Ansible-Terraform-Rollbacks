---
# AAP Credentials configuration
controller_credentials:
  - name: AWS Demo Credentials
    organization: "{{ aap_organization_name }}"
    credential_type: Amazon Web Services
    description: AWS credentials for provisioning demo infrastructure
    inputs:
      username: "{{ vault_aws_access_key_id }}"
      password: "{{ vault_aws_secret_access_key }}"

  - name: GitHub SCM Credential
    organization: "{{ aap_organization_name }}"
    credential_type: Source Control
    description: GitHub credentials for project sync
    inputs:
      username: git
      password: "{{ vault_github_password }}"

  - name: Slack Webhook Credential
    organization: "{{ aap_organization_name }}"
    credential_type: Slack Webhook
    description: Slack webhook URL for sending notifications
    inputs:
      webhook_url: "{{ vault_slack_webhook_url }}"

