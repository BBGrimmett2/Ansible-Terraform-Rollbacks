---
# Ansible Execution Environment Definition
# Docs: https://docs.ansible.com/projects/builder/en/latest/definition/
# Schema version for ansible-builder
version: 3

# Container images to use
images:
  # Base image - choose the appropriate image for your needs
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

# Dependencies to install in the execution environment
dependencies:
  # Ansible Galaxy requirements (collections and roles)
  galaxy:
    collections:
      - name: amazon.aws
        version: ">=8.0.0"

      - name: community.aws
        version: ">=8.0.0"

      - name: infra.aap_configuration
        version: ">=2.8.0"

      - name: ansible.controller
        version: ">=4.8.2"

      # ansible.eda removed - not needed for Terraform rollback demo
      # It requires gssapi compilation which adds build complexity

      - name: cloud.terraform
        version: ">=3.0.0"

  # Python package requirements file
  python: requirements/requirements.txt

  # System-level dependencies (RPM packages, etc.)
  system:
    - unzip [platform:rpm]

# Build options
options:
  # Package manager to use in the container
  package_manager_path: /usr/bin/microdnf

additional_build_files:
  - src: files/ansible.cfg
    dest: configs

additional_build_steps:
  prepend_base:
    - RUN /usr/bin/python3 -m ensurepip --upgrade || /usr/bin/python3 -m ensurepip
    - RUN /usr/bin/python3 -m pip install --upgrade pip setuptools wheel

  prepend_galaxy:
    - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg

  prepend_builder:
    - RUN /usr/bin/microdnf install -y python3-devel gcc --nodocs --setopt install_weak_deps=0 || true
    - RUN /usr/bin/python3 -m ensurepip --upgrade || /usr/bin/python3 -m ensurepip || true
    - RUN /usr/bin/python3 -m pip install --upgrade pip setuptools wheel || true
    - RUN /usr/bin/microdnf install -y python3-pip || true
    - RUN /usr/bin/python3 -m pip install pyyaml packaging bindep || true

  prepend_final:
    - RUN whoami
    - RUN cat /etc/os-release
    - RUN /usr/bin/python3 -m ensurepip --upgrade || /usr/bin/python3 -m ensurepip
    - RUN /usr/bin/python3 -m pip install --upgrade pip setuptools wheel

  append_base:
    - RUN /usr/bin/python3 -m ensurepip --upgrade || /usr/bin/python3 -m ensurepip
    - RUN /usr/bin/python3 -m pip install --upgrade pip setuptools wheel

  append_final:
    # Install OpenTofu and symlink as terraform (runs after system dependencies installed)
    - RUN ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') && TOFU_VERSION="1.8.8" && curl -sL "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_${ARCH}.zip" -o /tmp/tofu.zip && unzip -q /tmp/tofu.zip -d /usr/local/bin/ && rm /tmp/tofu.zip && chmod +x /usr/local/bin/tofu && ln -s /usr/local/bin/tofu /usr/local/bin/terraform && tofu version && terraform version