---
# Terraform provision tasks

- name: Provision infrastructure with Terraform
  block:
    - name: Initialize Terraform
      ansible.builtin.command:
        cmd: "{{ terraform_binary }} init"
        chdir: "{{ terraform_dir }}"
      register: tf_init
      changed_when: "'Terraform has been successfully initialized' in tf_init.stdout"

    - name: Display Terraform init output
      ansible.builtin.debug:
        var: tf_init.stdout_lines

    - name: Select Terraform workspace
      ansible.builtin.command:
        cmd: "{{ terraform_binary }} workspace select {{ terraform_workspace }}"
        chdir: "{{ terraform_dir }}"
      register: tf_workspace
      changed_when: false
      failed_when: false

    - name: Create Terraform workspace if it doesn't exist
      ansible.builtin.command:
        cmd: "{{ terraform_binary }} workspace new {{ terraform_workspace }}"
        chdir: "{{ terraform_dir }}"
      when: tf_workspace.rc != 0
      changed_when: true

    - name: Build Terraform plan command
      ansible.builtin.set_fact:
        tf_plan_cmd: >-
          {{ terraform_binary }} plan
          {% if terraform_var_file | length > 0 %}-var-file={{ terraform_var_file }}{% endif %}
          {% for key, value in terraform_extra_vars.items() %}-var '{{ key }}={{ value | lower if value is boolean else value }}'{% if not loop.last %} {% endif %}{% endfor %}
          -out=tfplan

    - name: Build Terraform apply command
      ansible.builtin.set_fact:
        tf_apply_cmd: >-
          {{ terraform_binary }} apply
          {% if terraform_auto_approve %}-auto-approve{% endif %}
          tfplan

    - name: Run Terraform plan
      ansible.builtin.command:
        cmd: "{{ tf_plan_cmd }}"
        chdir: "{{ terraform_dir }}"
      register: tf_plan
      changed_when: false

    - name: Display Terraform plan output
      ansible.builtin.debug:
        var: tf_plan.stdout_lines

    - name: Apply Terraform plan
      ansible.builtin.command:
        cmd: "{{ tf_apply_cmd }}"
        chdir: "{{ terraform_dir }}"
      register: tf_apply
      changed_when: "'Apply complete!' in tf_apply.stdout"

    - name: Display Terraform apply output
      ansible.builtin.debug:
        var: tf_apply.stdout_lines

    - name: Get Terraform outputs
      ansible.builtin.command:
        cmd: "{{ terraform_binary }} output -json"
        chdir: "{{ terraform_dir }}"
      register: tf_outputs
      changed_when: false

    - name: Parse Terraform outputs
      ansible.builtin.set_fact:
        terraform_outputs: "{{ tf_outputs.stdout | from_json }}"
      when: tf_outputs.stdout | length > 0

    - name: Display provisioned resources
      ansible.builtin.debug:
        msg:
          - "Infrastructure provisioned successfully!"
          - "VPC ID: {{ terraform_outputs.vpc_id.value | default('N/A') }}"
          - "Subnet ID: {{ terraform_outputs.subnet_id.value | default('N/A') }}"
          - "Instance ID: {{ terraform_outputs.instance_id.value | default('N/A') }}"
          - "Instance Public IP: {{ terraform_outputs.instance_public_ip.value | default('N/A') }}"
      when: terraform_outputs is defined

  rescue:
    - name: Display Terraform failure message
      ansible.builtin.debug:
        msg:
          - "Terraform provisioning failed!"
          - "Error will trigger workflow rollback (Terraform destroy)."

    - name: Fail to trigger workflow rollback
      ansible.builtin.fail:
        msg: "Terraform provision failed. Workflow will execute rollback."
